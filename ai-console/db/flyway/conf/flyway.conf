# ============================================================
# Flyway 配置模板
# 对应项目: ai-console PostgreSQL 数据库
# ============================================================

# 数据库连接
flyway.url=jdbc:postgresql://localhost:5432/ai_console
flyway.user=ai_console_admin
flyway.password=${DB_PASSWORD}

# Schema 设置
flyway.schemas=public
flyway.defaultSchema=public

# 迁移文件位置（相对 classpath 或文件系统）
flyway.locations=filesystem:db/migration,filesystem:db/callbacks

# 基线设置（已有数据库首次接入 Flyway 时使用）
# flyway.baselineOnMigrate=true
# flyway.baselineVersion=1

# 校验与修复
flyway.validateOnMigrate=true
flyway.cleanDisabled=true

# 日志级别
flyway.loggers=auto

# 占位符（可在 SQL 中使用 ${placeholder}）
flyway.placeholderPrefix=${
flyway.placeholderSuffix=}
flyway.placeholders.appSchema=public
flyway.placeholders.appUser=ai_console_app

# 编码
flyway.encoding=UTF-8

# 迁移命名规则
# Versioned : V<version>__<description>.sql
# Repeatable: R__<description>.sql
# Undo      : U<version>__<description>.sql (Teams/Enterprise)
