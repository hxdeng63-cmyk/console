# mediamtx minimal config for live monitoring
logLevel: info

# Enable REST API for dynamic path management
api: yes
apiAddress: :9997
apiAllowOrigin: '*'

# RTSP server
rtsp: yes
rtspAddress: :8554

# RTMP server
rtmp: yes
rtmpAddress: :1935

# HLS / HTTP-FLV server
hls: yes
hlsAddress: :8888

# Force TCP transport for RTSP (required for SSH tunnel forwarding)
pathDefaults:
  rtspTransport: tcp

# No pre-configured paths - managed dynamically via REST API
paths: {}
